name = "interactive-school-api"
main = "worker.mjs"
compatibility_date = "2026-11-14"

[vars]
ALLOWED_ORIGIN = "https://mosa-math.github.io"
TURNSTILE_HOSTNAME = "mosa-math.github.io"
OPENAI_MODEL = "gpt-4o-mini"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
